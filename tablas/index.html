
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tabla del 3</title>

    <link rel="stylesheet" href="multiplicar.css">

    <script src="multiplicar.js" defer></script>

</head>

<body>

    <main class="contenedor">

        <section class="tarjeta">

            <header class="encabezado">

                <div class="marca">

                    <span class="marca-icono">
                        3
                    </span>

                    <div>

                        <p class="marca-superior">
                            OPERACIONES
                        </p>

                        <h1>
                            Tabla de multiplicar
                        </h1>

                    </div>

                </div>

                <button
                    class="boton-probar"
                    onclick="generarTablas()"
                >
                    PROBAR
                </button>

            </header>


            <div class="separador"></div>


            <div class="entrada-tabla">

                <label for="txtNumero">
                    Número de la tabla
                </label>

                <input
                    type="number"
                    id="txtNumero"
                    placeholder="Ejemplo: 8"
                >
                <small class="ayuda">
    Ingresa un número entero, por ejemplo: 3, 5, 8 o 10.
</small>

            </div>


            <div class="descripcion">

                <p>
                    Ingresa un número para generar
                    su tabla de multiplicar.
                </p>

            </div>


            <div
                id="contenedorTabla"
                class="tabla-contenedor"
            >

                <table>

                    <thead>

                        <tr>
                            <th>OPERACIÓN</th>
                            <th>RESULTADO</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr>
                            <td>3 × 1</td>
                            <td>3</td>
                        </tr>

                        <tr>
                            <td>3 × 2</td>
                            <td>6</td>
                        </tr>

                        <tr>
                            <td>3 × 3</td>
                            <td>9</td>
                        </tr>

                        <tr>
                            <td>3 × 4</td>
                            <td>12</td>
                        </tr>

                        <tr>
                            <td>3 × 5</td>
                            <td>15</td>
                        </tr>

                        <tr>
                            <td>3 × 6</td>
                            <td>18</td>
                        </tr>

                        <tr>
                            <td>3 × 7</td>
                            <td>21</td>
                        </tr>

                        <tr>
                            <td>3 × 8</td>
                            <td>24</td>
                        </tr>

                        <tr>
                            <td>3 × 9</td>
                            <td>27</td>
                        </tr>

                        <tr>
                            <td>3 × 10</td>
                            <td>30</td>
                        </tr>

                    </tbody>

                </table>

            </div>


            <footer class="pie">

                <span>Dimas Vera</span>

                <span class="separador-footer">
                    •
                </span>

                <span>2026</span>

                <span class="separador-footer">
                    •
                </span>

                <span>KrakeDEV</span>

            </footer>

        </section>

    </main>

</body>

</html>
